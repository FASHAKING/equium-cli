name: Build CLI miner

on:
  push:
    tags:
      - "cli-miner-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            ext: tar.gz
          # macos-13 is the last Intel runner — macos-latest is now ARM, and
          # cross-compiling solana-client's native deps to x64 is painful.
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-x64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            ext: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cli-miner-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Build release binary
        run: cargo build -p equium-cli-miner --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          bin_name="equium-miner"
          if [[ "${{ matrix.label }}" == windows-* ]]; then
            bin_name="equium-miner.exe"
          fi
          src="target/${{ matrix.target }}/release/${bin_name}"
          [ -f "$src" ] || { echo "binary not found at $src" >&2; exit 1; }
          stage="equium-miner-${{ matrix.label }}"
          mkdir -p "$stage"
          cp "$src" "$stage/"
          cp LICENSE README.md "$stage/" 2>/dev/null || true
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            # Use PowerShell on Windows runners (no `zip` by default).
            powershell -NoProfile -Command "Compress-Archive -Path '${stage}/*' -DestinationPath 'out/${stage}.zip'"
          else
            tar -czf "out/${stage}.tar.gz" "$stage"
          fi
          ls -la out/

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          cd out
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          cat *.sha256 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: equium-cli-miner-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/cli-miner-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: false
